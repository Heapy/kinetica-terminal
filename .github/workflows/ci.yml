name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shared:
    name: JVM and JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: JVM engine tests
        run: ./kotlin test -m kinetica-terminal -p jvm
      - name: Build browser and JavaScript tests
        run: ./kotlin build -m kinetica-terminal -m browser-terminal -p js -v release
      - name: JavaScript engine tests
        run: node build/artifacts/CompiledWebArtifact/kinetica-terminaljsTestrelease/kotlin-output/kinetica-terminal_test.mjs
